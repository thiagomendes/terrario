<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Terrário</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icone.svg" type="image/svg+xml" />
    <link rel="icon" href="/icone-180.png" type="image/png" sizes="180x180" />
    <link rel="apple-touch-icon" href="/icone-180.png" />
    <meta name="description" content="Explore, construa e descubra mundos de brinquedo, sozinho ou com amigos." />
    <meta property="og:title" content="Terrário" />
    <meta property="og:description" content="Explore, construa e descubra mundos de brinquedo, sozinho ou com amigos." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/compartilhar.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Terrário" />
    <meta name="theme-color" content="#8fcaf5" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overflow-x: hidden;
        max-width: 100%;
        background: #8fcaf5;
        /* sem zoom por toque duplo no celular */
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
        overscroll-behavior-x: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* o jogo nunca rola a página: sem "puxar para recarregar" nem elástico */
      body {
        position: fixed;
        inset: 0;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      * {
        -webkit-tap-highlight-color: transparent;
      }
      input,
      textarea,
      [contenteditable] {
        -webkit-touch-callout: default;
        -webkit-user-select: text;
        user-select: text;
      }
      /* o canvas recebe toques mesmo com os controles escondidos */
      #cena {
        touch-action: none;
        -webkit-touch-callout: none;
      }
      /* painéis roláveis: rolam na vertical sem arrastar a página junto */
      .entrada,
      .modal .corpo,
      .painel-personagem,
      .inventario,
      .catalogo .grade-slots,
      .livro .lista {
        touch-action: pan-y;
        overscroll-behavior: contain;
      }
      button {
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
